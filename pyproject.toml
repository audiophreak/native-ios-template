[project]
name = "native-ios-template-dev"
version = "0.0.0"
description = "Test environment for the native-ios Copier template (not a published package)."
requires-python = ">=3.12"
dependencies = [
  "copier==9.19.1",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
]

[tool.uv]
package = false
# Only resolve packages published before this date (rolling two-week supply-chain buffer).
exclude-newer = "2026-11-04T00:00:00Z"
python-downloads = "never"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-ra"
tmp_path_retention_policy = "failed"
markers = [
  "xcode: needs Xcode, the iOS Simulator runtime and network access (CI runs these on a macOS runner)",
]
