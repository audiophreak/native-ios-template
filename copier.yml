# native-ios-template: the Native iOS Copier template (SwiftUI app, generated typed API client, Keychain storage).
# An ADD-ON to web-core-template: it is applied to the directory of a project generated by web-core-template with
# `native_client=true` and owns only `ios/` and its own answers file. It never rewrites the web project's files.
# Independently versioned: releases are git tags (vMAJOR.MINOR.PATCH). Rendered from ./template.
_min_copier_version: "9.19.1"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.ios.yml
_exclude:
  - copier.yml
  - copier.yaml
  - "~*"
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store
  - .svn
  - xcuserdata
  - DerivedData
  - .build

# Deliberately no `_tasks`, `_migrations` or `_jinja_extensions`: they execute code and would force users to
# run Copier with --trust. Generation only renders files.

app_name:
  type: str
  help: "Application name (lowercase letters, digits and hyphens; the web project's name)"
  validator: >-
    {% if not (app_name | regex_search('^[a-z][a-z0-9]*(-[a-z0-9]+)*$')) or (app_name | length) > 64 %}
    Use 1-64 lowercase letters, digits and single hyphens, starting with a letter.
    {% endif %}

app_display_name:
  type: str
  default: "{{ app_name | replace('-', ' ') | title }}"
  help: "Name shown under the app icon (ASCII letters, digits and spaces)"
  validator: >-
    {% if not (app_display_name | regex_search('^[A-Za-z][A-Za-z0-9]*( [A-Za-z0-9]+)*$')) or (app_display_name | length) > 30 %}
    Use up to 30 ASCII letters, digits and single spaces, starting with a letter.
    {% endif %}

bundle_identifier:
  type: str
  default: "com.example.{{ app_name | replace('-', '') }}"
  help: "Bundle identifier (reverse DNS). The default is a placeholder: choose your own before you sign for a device. No team identifier is needed to build and test on the simulator."
  validator: >-
    {% if not (bundle_identifier | regex_search('^[A-Za-z][A-Za-z0-9]*([.][A-Za-z][A-Za-z0-9-]*)+$')) or (bundle_identifier | length) > 80 %}
    Use a reverse-DNS identifier such as com.example.myapp (letters, digits, hyphens and dots; at least two parts).
    {% endif %}

debug_api_port:
  type: int
  default: 3000
  help: "Port of the local development server the Debug build talks to (http://localhost:PORT)"
  validator: >-
    {% if debug_api_port < 1024 or debug_api_port > 65535 %}Use a port from 1024 to 65535.{% endif %}

release_api_host:
  type: str
  default: api.example.com
  help: "Host (and optional port) of the API the Release build talks to over https. A placeholder: set your real host before shipping."
  validator: >-
    {% if not (release_api_host | regex_search('^[a-z0-9]([a-z0-9-]*[a-z0-9])?([.][a-z0-9]([a-z0-9-]*[a-z0-9])?)+(:[0-9]{2,5})?$')) %}
    Use a lowercase host name with at least one dot, and an optional :port. No scheme, path or credentials.
    {% endif %}
