name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    name: template (rendering, layering, static rules)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -m "not xcode" -q

  xcode:
    name: xcode (generated client, package tests, simulator build and tests)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Select the newest installed Xcode 26 and show the toolchain
        run: |
          APP="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          echo "using $APP"
          sudo xcode-select -s "$APP"
          xcodebuild -version
          [ "$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)" = "26" ]
          swift --version
          xcrun simctl list runtimes
      - name: Render the layer into a throwaway project
        run: |
          mkdir -p "$RUNNER_TEMP/project"
          uv run copier copy --defaults --data app_name=ci-app --vcs-ref HEAD . "$RUNNER_TEMP/project"
      - name: Static checks and contract checksum
        working-directory: ${{ runner.temp }}/project/ios
        run: |
          sh scripts/check-static.sh
          sh scripts/check-contract.sh
      - name: Regenerate the client into a disposable directory and require zero difference
        working-directory: ${{ runner.temp }}/project/ios
        run: sh scripts/check-generated.sh
      - name: Package tests (host)
        working-directory: ${{ runner.temp }}/project/ios/Packages/AppCore
        run: swift test
      - name: App tests on the iOS Simulator (hosted: Keychain, configuration, wiring)
        working-directory: ${{ runner.temp }}/project/ios
        run: |
          xcrun simctl boot "$(sh scripts/simulator.sh)" || true
          sh scripts/test.sh app
      - name: Package tests on the iOS Simulator
        working-directory: ${{ runner.temp }}/project/ios
        run: sh scripts/test.sh package
      - name: Release configuration requires https
        working-directory: ${{ runner.temp }}/project/ios
        run: sh scripts/check-release-config.sh
      - name: Template tests that need Xcode
        run: uv run pytest -m xcode -q
